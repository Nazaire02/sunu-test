name: Garde anti-malware

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  garde:
    name: Garde anti-malware
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Aucune dépendance installée : la garde est du Node pur et lit les fichiers comme du texte.
      - name: Analyse du dépôt
        run: node scripts/garde-malware.js

      - name: Tests de la garde
        run: node --test scripts/garde-malware.test.js
